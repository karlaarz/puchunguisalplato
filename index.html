<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Puchungis al Plato</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F7F5;
      --white: #FFFFFF;
      --mint: #5A8A74;
      --mint-card: #BDD4CA;
      --mint-light: #E8F2EE;
      --mint-dark: #3D6B59;
      --lilac: #9B7EC8;
      --lilac-card: #D4C4EB;
      --lilac-light: #EDE8F5;
      --lilac-dark: #6B4FA0;
      --text: #0C0A07;
      --text-mid: #5B5552;
      --text-light: #AFABA5;
      --border: #E4DDD8;
      --gold: #CFAB4D;
      --purple: #9B59B6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--mint);
      color: white;
      padding: 40px 28px 32px;
      text-align: center;
    }
    header h1 {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    header p { font-size: 13px; opacity: 0.65; margin-top: 7px; letter-spacing: 0.8px; }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 20px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      padding: 15px 16px;
      border: none;
      border-bottom: 2.5px solid transparent;
      background: transparent;
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.2px;
    }
    .tab.active {
      color: var(--mint);
      border-bottom-color: var(--mint);
      font-weight: 700;
    }

    /* MEAT FILTER */
    .meat-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 8px 20px; display: flex; align-items: center; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch; position: sticky; top: 46px; z-index: 49; }
    .meat-bar-label { font-size: 10px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; flex-shrink: 0; }
    .mfilter-btn { display: flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-mid); white-space: nowrap; transition: all 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
    .mfilter-btn.active { background: var(--mint-light); border-color: var(--mint); color: var(--mint-dark); }

    /* RATING FILTER BAR */
    .rating-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 8px 20px; display: flex; align-items: center; gap: 8px; overflow-x: auto; position: sticky; top: 46px; z-index: 48; }
    .rating-bar-label { font-size: 10px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; flex-shrink: 0; }
    .rfilter-btn { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-mid); white-space: nowrap; transition: all 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
    .rfilter-btn.active-e { background: #FFF8E7; border-color: var(--gold); color: #8A6A1A; }
    .rfilter-btn.active-k { background: #F5EEF8; border-color: var(--purple); color: #7D3C98; }
    .rfilter-btn.active-a { background: var(--mint-light); border-color: var(--mint); color: var(--mint-dark); }
    .rfilter-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

    /* GRID WRAPPER */
    .grid { padding: 0; }

    /* ── RECIPE TILE GRID ── */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 18px;
    }
    .recipe-tile {
      background: var(--white);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .recipe-tile:active { transform: scale(0.97); box-shadow: 0 4px 18px rgba(0,0,0,0.13); }
    .tile-top {
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 110px;
    }
    .tile-badges { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
    .tile-name {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      flex: 1;
    }
    .tile-stars {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tile-star-row { display: flex; align-items: center; gap: 2px; }
    .tile-star-label { font-size: 9px; font-weight: 700; color: rgba(0,0,0,0.4); min-width: 38px; text-transform: uppercase; letter-spacing: 0.4px; }
    .mini-star { font-size: 11px; line-height: 1; color: rgba(0,0,0,0.15); }
    .mini-star.e { color: var(--gold); }
    .mini-star.k { color: var(--purple); }
    .tile-bottom {
      padding: 10px 16px;
      background: white;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .tile-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-mid);
      font-weight: 600;
    }
    .tile-meta svg { width: 11px; height: 11px; color: var(--text-light); }
    .tile-meat-tag {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .tile-meat-tag svg { width: 10px; height: 10px; }

    /* ── DETAIL VIEW ── */
    .back-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 11px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 46px;
      z-index: 49;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--mint);
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn svg { width: 16px; height: 16px; }
    .back-crumb { font-size: 12px; color: var(--text-light); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detail-card {
      margin: 16px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.11);
    }
    @media (min-width: 680px) {
      .detail-card { display: grid; grid-template-columns: 40% 1fr; }
      .detail-right { border-top: none !important; border-left: 1px solid var(--border); }
    }
    .detail-left {
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
    }
    .detail-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .detail-name {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
    }
    .detail-rating-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(0,0,0,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .detail-right {
      background: var(--white);
      padding: 24px 22px;
      border-top: 1px solid var(--border);
    }

    /* CARD NAME (used in detail) */
    .card-name {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }
    .card-stars { display: flex; flex-direction: column; gap: 3px; }

    /* CATEGORY GRID (vista Todas) */
    .cat-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .cat-tile {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 16px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .cat-tile:active { transform: scale(0.96); box-shadow: 0 4px 18px rgba(0,0,0,0.1); }
    .cat-tile-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-tile-icon svg { width: 26px; height: 26px; }
    .cat-tile-name {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.3;
    }
    .cat-tile-count {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 500;
    }

    /* MEAT BADGE */

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-ensalada { background: rgba(46,125,50,0.15); color: #2E7D32; }
    .badge-salsa    { background: rgba(230,81,0,0.12); color: #BF460A; }
    .badge-fuerte   { background: rgba(61,107,89,0.15); color: var(--mint-dark); }
    .badge-primer   { background: var(--lilac-light); color: var(--lilac-dark); }
    .badge-postre   { background: rgba(173,20,87,0.12); color: #AD1457; }

    /* MEAT BADGE */
    .meat-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--mint-dark);
      opacity: 0.65;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .meat-badge svg { width: 11px; height: 11px; }


    /* STATS ROW (top of body) */
    .stats-row {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      border-right: 1px solid var(--border);
    }
    .stat-item:last-child { border-right: none; }
    .stat-item svg { width: 20px; height: 20px; color: var(--mint); opacity: 0.8; }
    .stat-label { font-size: 10px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 15px; font-weight: 700; color: var(--text); }

    /* MULTIPLIER */
    .mult-section { margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .section-title {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }
    .mult-btns { display: flex; gap: 8px; align-items: center; }
    .mult-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-mid);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mult-btn.active {
      background: var(--mint);
      border-color: var(--mint);
      color: white;
    }
    .mult-servings {
      font-size: 13px;
      color: var(--text-light);
      margin-left: 6px;
      font-weight: 500;
    }

    /* GROUP TITLE (ingredient groups) */
    .group-title {
      font-size: 11px; font-weight: 700; color: var(--text-light);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin: 16px 0 8px; opacity: 0.75;
    }

    /* INGREDIENTS */
    .ing-list { list-style: none; margin-bottom: 28px; }
    .ing-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }
    .ing-dot {
      width: 6px;
      height: 6px;
      background: var(--mint);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .ing-amount {
      font-weight: 700;
      color: var(--text);
      min-width: 70px;
      flex-shrink: 0;
      font-size: 14px;
    }
    .ing-name { color: var(--text-mid); line-height: 1.4; font-size: 15px; }

    /* STEPS */
    .step-list { list-style: none; }
    .step-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .step-dot {
      width: 7px;
      height: 7px;
      background: var(--mint);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 7px;
    }
    .step-text { font-size: 15px; line-height: 1.7; color: var(--text-mid); }

    .divider { height: 1px; background: var(--border); margin: 22px 0; }

    /* RATING IN CARD HEADER */
    .header-ratings { margin-top: 4px; }
    .rating-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .rating-row:last-child { margin-bottom: 0; }
    .rating-label { font-size: 12px; font-weight: 700; min-width: 64px; color: rgba(0,0,0,0.5); }
    .stars-input { display: flex; gap: 2px; }
    .star-btn { font-size: 22px; line-height: 1; background: none; border: none; cursor: pointer; padding: 2px; -webkit-tap-highlight-color: transparent; color: rgba(0,0,0,0.15); }
    .star-btn.e { color: var(--gold); }
    .star-btn.k { color: var(--purple); }
    .rating-clear { font-size: 10px; color: rgba(0,0,0,0.35); background: none; border: none; cursor: pointer; padding: 3px; text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Puchungis al Plato</h1>
  <p>Recetas saludables y deliciosas</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="filter('todas')">Todas</button>
  <button class="tab" onclick="filter('ensalada')">Ensaladas</button>
  <button class="tab" onclick="filter('salsa')">Salsas</button>
  <button class="tab" onclick="filter('fuerte')">Platos Fuertes</button>
  <button class="tab" onclick="filter('primer')">Primer Plato</button>
  <button class="tab" onclick="filter('postre')">Postres</button>
</div>

<div class="meat-bar" id="meat-bar">
  <span class="meat-bar-label">Carne:</span>
  <button class="mfilter-btn active" id="mfilter-all" onclick="filterMeat('all')">Todas</button>
  <button class="mfilter-btn" id="mfilter-aves" onclick="filterMeat('aves')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
    Aves
  </button>
  <button class="mfilter-btn" id="mfilter-conejo" onclick="filterMeat('conejo')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3c0 3 1 5 2 6"/><path d="M18 3c0 3-1 5-2 6"/><path d="M8 9h8a4 4 0 0 1 4 4v1a6 6 0 0 1-12 0v-1a4 4 0 0 1 4-4h-4"/><circle cx="10" cy="16" r="0.8" fill="currentColor" stroke="none"/><circle cx="14" cy="16" r="0.8" fill="currentColor" stroke="none"/></svg>
    Conejo
  </button>
  <button class="mfilter-btn" id="mfilter-pescado" onclick="filterMeat('pescado')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c0 0 2.5-5 9-5 0 3.5-1.5 5-1.5 5s1.5 1.5 1.5 5c-6.5 0-9-5-9-5z"/><path d="M3 9l3.5 3L3 15"/><circle cx="13" cy="10" r="0.8" fill="currentColor" stroke="none"/></svg>
    Pescado
  </button>
  <button class="mfilter-btn" id="mfilter-res" onclick="filterMeat('res')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    Res
  </button>
  <button class="mfilter-btn" id="mfilter-cerdo" onclick="filterMeat('cerdo')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="14" rx="3.5" ry="2"/><circle cx="10.5" cy="14" r="0.7" fill="currentColor" stroke="none"/><circle cx="13.5" cy="14" r="0.7" fill="currentColor" stroke="none"/><path d="M8.5 8.5c-.5-1.5 0-3 1.5-3.5"/><path d="M15.5 8.5c.5-1.5 0-3-1.5-3.5"/></svg>
    Cerdo
  </button>
</div>

<div class="rating-bar" id="rating-bar">
  <span class="rating-bar-label">Filtrar:</span>
  <button class="rfilter-btn active-a" id="rfilter-all" onclick="filterByRating('all')">Todas</button>
  <button class="rfilter-btn" id="rfilter-e5" onclick="filterByRating('e5')">★ Karla 5/5</button>
  <button class="rfilter-btn" id="rfilter-k5" onclick="filterByRating('k5')">★ Edmundo 5/5</button>
  <button class="rfilter-btn" id="rfilter-rated" onclick="filterByRating('rated')">Calificadas</button>
</div>

<div class="grid" id="grid"></div>

<script>
const ICONS = {
  leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>`,
  cupcake: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14l-2 9H7z"/><path d="M4.5 8.5C4.5 6 6.5 4 9 4c.4-1.2 1.6-2 3-2s2.6.8 3 2c2.5 0 4.5 2 4.5 4.5H4.5z"/><path d="M9.5 11v9"/><path d="M14.5 11v9"/></svg>`,
  wheat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22 12 2"/><path d="M7 12c-1.7-1.7-2-4.5-.6-6.6"/><path d="M17 12c1.7-1.7 2-4.5.6-6.6"/><path d="M12 12c0-2.4-1.4-4.5-3.5-5.5"/><path d="M12 12c0-2.4 1.4-4.5 3.5-5.5"/><path d="M9.5 19.5c-1.7-1.7-2-4.5-.6-6.6"/><path d="M14.5 19.5c1.7-1.7 2-4.5.6-6.6"/></svg>`,
  zap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,

// State
const multipliers = {};
let currentFilter = 'todas';

function initRecipes(data) {
  recipes = data;
  recipes.forEach(r => { if (!multipliers[r.id]) multipliers[r.id] = 1; });
}

// Fraction display
function fmtAmount(amount, mult) {
  if (amount === null) return '';
  const val = amount * mult;
  const fracs = [
    [1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],
    [1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']
  ];
  const int = Math.floor(val);
  const dec = val - int;
  let fStr = '';
  for (const [f, s] of fracs) {
    if (Math.abs(dec - f) < 0.025) { fStr = s; break; }
  }
  if (int === 0 && fStr) return fStr;
  if (fStr) return int + ' ' + fStr;
  if (Math.abs(val - Math.round(val)) < 0.025) return Math.round(val).toString();
  return val.toFixed(1);
}

function renderIngredients(recipe, mult) {
  return recipe.groups.map(g => {
    let html = '';
    if (g.name) html += `<div class="group-title">${g.name}</div>`;
    html += '<ul class="ing-list">';
    for (const ing of g.items) {
      const amt = fmtAmount(ing.a, mult);
      const unit = ing.u ? ' ' + ing.u : '';
      html += `<li class="ing-item">
        <div class="ing-dot"></div>
        <span class="ing-amount">${amt}${unit}</span>
        <span class="ing-name">${ing.n}</span>
      </li>`;
    }
    html += '</ul>';
    return html;
  }).join('');
}

function servingsText(recipe, mult) {
  const n = recipe.servingsBase * mult;
  const num = Number.isInteger(n) ? n : (n % 1 === 0.5 ? n : n.toFixed(1));
  return `${num} ${recipe.servingsUnit}`;
}

function renderMiniStars(recipeId) {
  const r = ratings[recipeId] || {};
  let html = '';
  if (r.e) {
    html += `<span class="card-star-group"><span class="card-star-label">Yo</span>` +
      Array.from({length:5}, (_,i) => `<span class="mini-star${i<r.e?' e':''}">★</span>`).join('') + `</span>`;
  }
  if (r.k) {
    html += `<span class="card-star-group"><span class="card-star-label">Edmundo</span>` +
      Array.from({length:5}, (_,i) => `<span class="mini-star${i<r.k?' k':''}">★</span>`).join('') + `</span>`;
  }
  return html;
}

function renderRatingInputs(recipeId) {
  const r = ratings[recipeId] || {};
  const row = (person, label, cls) => {
    const stars = Array.from({length:5}, (_,i) =>
      `<button class="star-btn${r[person]>=i+1?' '+cls:''}" onclick="event.stopPropagation();saveRating(${recipeId},'${person}',${i+1})">★</button>`
    ).join('');
    const clear = r[person] ? `<button class="rating-clear" onclick="event.stopPropagation();clearRating(${recipeId},'${person}')">limpiar</button>` : '';
    return `<div class="rating-row"><span class="rating-label">${label}</span><div class="stars-input">${stars}</div>${clear}</div>`;
  };
  return row('e','Karla','e') + row('k','Edmundo','k');
}

function saveRating(recipeId, person, value) {
  if (!ratings[recipeId]) ratings[recipeId] = {};
  ratings[recipeId][person] = (ratings[recipeId][person] === value) ? undefined : value;
  if (!ratings[recipeId][person]) delete ratings[recipeId][person];
  if (!Object.keys(ratings[recipeId]).length) delete ratings[recipeId];
  localStorage.setItem('recetario-ratings', JSON.stringify(ratings));
  const ratingEl = document.getElementById(`ratings-${recipeId}`);
  if (ratingEl) ratingEl.innerHTML = renderRatingInputs(recipeId);
}

function clearRating(recipeId, person) {
  if (ratings[recipeId]) { delete ratings[recipeId][person]; if (!Object.keys(ratings[recipeId]).length) delete ratings[recipeId]; }
  localStorage.setItem('recetario-ratings', JSON.stringify(ratings));
  const ratingEl = document.getElementById(`ratings-${recipeId}`);
  if (ratingEl) ratingEl.innerHTML = renderRatingInputs(recipeId);
}

function filterByRating(type) {
  ratingFilter = type;
  document.querySelectorAll('.rfilter-btn').forEach(b => b.classList.remove('active-e','active-k','active-a'));
  const map = { all:'active-a', e5:'active-e', k5:'active-k', rated:'active-a' };
  document.getElementById('rfilter-'+type).classList.add(map[type]);
  render();
}

function tileColor(r, idx) {
  const pal = CAT_PALETTE[r.category] || CAT_PALETTE.fuerte;
  return pal[idx % pal.length];
}

function tileStarsHTML(recipeId) {
  const rt = ratings[recipeId] || {};
  let html = '';
  if (rt.e || rt.k) {
    html = '<div class="tile-stars">';
    if (rt.e) html += `<div class="tile-star-row"><span class="tile-star-label">Karla</span>${Array.from({length:5},(_,i)=>`<span class="mini-star${i<rt.e?' e':''}">★</span>`).join('')}</div>`;
    if (rt.k) html += `<div class="tile-star-row"><span class="tile-star-label">Edmundo</span>${Array.from({length:5},(_,i)=>`<span class="mini-star${i<rt.k?' k':''}">★</span>`).join('')}</div>`;
    html += '</div>';
  }
  return html;
}

    </div>
  </div>`;
}

function openRecipe(id) {
  activeRecipeId = id;
  const r = recipes.find(x => x.id === id);
  document.getElementById('grid').innerHTML = recipeDetailHTML(r);
  // Hide filter bars in detail view
  document.getElementById('meat-bar').style.display = 'none';
  document.getElementById('rating-bar').style.display = 'none';
  window.scrollTo(0, 0);
}

function closeRecipe() {
  activeRecipeId = null;
  render();
  // Restore filter bars for current tab
  const show = currentFilter !== 'todas';
  document.getElementById('rating-bar').style.display = show ? '' : 'none';
  document.getElementById('meat-bar').style.display = (currentFilter === 'fuerte') ? '' : 'none';
}

function applyFilters(list) {
  let out = list;
  if (meatFilter !== 'all') out = out.filter(r => r.meat === meatFilter);
  if (ratingFilter === 'e5') out = out.filter(r => (ratings[r.id]||{}).e >= 5);
  else if (ratingFilter === 'k5') out = out.filter(r => (ratings[r.id]||{}).k >= 5);
  else if (ratingFilter === 'rated') out = out.filter(r => ratings[r.id] && ((ratings[r.id].e||0)+(ratings[r.id].k||0)>0));
  return out;
}

const CAT_ICONS = {
  ensalada: 'leaf',
  salsa:    'spoon',
  fuerte:   'forkknife',
  primer:   'bowl',
  postre:   'cupcake',
};
const CAT_TILE_STYLE = {
  ensalada: 'background:var(--mint-light);color:var(--mint)',
  salsa:    'background:#FFF3E0;color:#C25A0A',
  fuerte:   'background:var(--mint-light);color:var(--mint-dark)',
  primer:   'background:var(--lilac-light);color:var(--lilac-dark)',
  postre:   'background:#FCE4EC;color:#AD1457',
};

function renderCategoryGrid() {
  return '<div class="cat-grid">' + CAT_ORDER.map(cat => {
    const count = recipes.filter(r => r.category === cat).length;
    if (!count) return '';
    const meta = CAT_META[cat];
    const icon = ICONS[CAT_ICONS[cat]] || ICONS.leaf;
    return `<div class="cat-tile" onclick="filter('${cat}')">
      <div class="cat-tile-icon" style="${CAT_TILE_STYLE[cat]}">${icon}</div>
      <div class="cat-tile-name">${meta.label}</div>
      <div class="cat-tile-count">${count} ${count===1?'receta':'recetas'}</div>
    </div>`;
  }).join('') + '</div>';
}

function render() {
  const grid = document.getElementById('grid');
  if (currentFilter === 'todas') {
    grid.innerHTML = renderCategoryGrid();
  } else {
    const filtered = applyFilters(recipes.filter(r => r.category === currentFilter));
    if (!filtered.length) {
      grid.innerHTML = '<p style="padding:24px;color:var(--text-light)">Sin resultados</p>';
    } else {
      grid.innerHTML = `<div class="recipe-grid">${filtered.map((r,i) => recipeTileHTML(r, i)).join('')}</div>`;
    }
  }
}


function setMult(id, mult, e) {
  e.stopPropagation();
  multipliers[id] = mult;
  const recipe = recipes.find(r => r.id === id);
  document.getElementById(`ings-${id}`).innerHTML = renderIngredients(recipe, mult);
  document.getElementById(`srv-${id}`).textContent = `→ ${servingsText(recipe, mult)}`;
  document.querySelectorAll(`.mult-btn`).forEach(btn => {
    const v = btn.textContent === '½×' ? 0.5 : btn.textContent === '1×' ? 1 : 2;
    btn.classList.toggle('active', v === mult);
  });
}

function filter(cat) {
  activeRecipeId = null;
  currentFilter = cat;
  const cats = ['todas','ensalada','salsa','fuerte','primer','postre'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', cats[i] === cat);
  });
  // Meat filter only for platos fuertes
  document.getElementById('meat-bar').style.display = (cat === 'fuerte') ? '' : 'none';
  // Rating filter for all category tabs except todas
  document.getElementById('rating-bar').style.display = (cat !== 'todas') ? '' : 'none';
  // Reset rating-bar sticky top: if meat-bar hidden, stay at 46px; if shown, push down
  document.getElementById('rating-bar').style.top = (cat === 'fuerte') ? '90px' : '46px';
  render();
}

function filterMeat(meat) {
  meatFilter = meat;
  document.querySelectorAll('.mfilter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mfilter-'+meat).classList.add('active');
  render();
}

// ── Inicialización: intenta cargar recipes.json, fallback a datos embebidos ──
(async function init() {
  try {
    const res = await fetch('recipes.json');
    if (!res.ok) throw new Error('no json');
    const data = await res.json();
    initRecipes(data);
  } catch {
    initRecipes(EMBEDDED);
  }
  // Hide filters on initial load (default tab is Todas)
  document.getElementById('meat-bar').style.display = 'none';
  document.getElementById('rating-bar').style.display = 'none';
  render();
})();
</script>
</body>
</html>
