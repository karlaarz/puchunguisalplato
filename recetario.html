<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mi Recetario</title>
  <style>
    :root {
      --bg: #F6F6F3;
      --white: #FFFFFF;
      --accent: #2E4057;
      --accent-light: #EAF0F8;
      --sage: #4A7C6F;
      --sage-light: #E6F2EF;
      --text: #1A1A1A;
      --text-mid: #555555;
      --text-light: #999999;
      --border: #E8E8E4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--accent);
      color: white;
      padding: 36px 24px 28px;
      text-align: center;
    }
    header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    header p { font-size: 13px; opacity: 0.55; margin-top: 6px; letter-spacing: 1px; }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 24px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      overflow-x: auto;
    }
    .tab {
      padding: 16px 20px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.3px;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* GRID */
    .grid {
      padding: 24px;
      display: grid;
      gap: 12px;
    }

    /* CARD */
    .card {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }
    .card-icon.sage { background: var(--sage-light); color: var(--sage); }
    .card-icon svg { width: 22px; height: 22px; }

    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.25; }
    .card-meta { display: flex; gap: 16px; margin-top: 5px; }
    .meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 4px; }
    .meta svg { width: 12px; height: 12px; flex-shrink: 0; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-snack { background: var(--accent-light); color: var(--accent); }
    .badge-fuerte { background: var(--sage-light); color: var(--sage); }

    .chevron {
      color: var(--text-light);
      transition: transform 0.3s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .chevron svg { width: 18px; height: 18px; }
    .chevron.open { transform: rotate(180deg); }

    /* BODY */
    .card-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 24px 22px;
    }
    .card-body.open { display: block; }

    /* MULTIPLIER */
    .multiplier {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .mult-left { flex: 1; }
    .mult-title { font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 5px; }
    .mult-title svg { width: 12px; height: 12px; }
    .mult-servings { font-size: 14px; color: var(--text-mid); margin-top: 4px; font-weight: 500; }
    .mult-btns { display: flex; gap: 6px; }
    .mult-btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text-mid);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mult-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* SECTION TITLES */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title svg { width: 13px; height: 13px; }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 16px 0 8px;
      opacity: 0.7;
    }

    /* INGREDIENTS */
    .ing-list { list-style: none; margin-bottom: 28px; }
    .ing-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .ing-amount {
      font-weight: 700;
      color: var(--accent);
      min-width: 76px;
      flex-shrink: 0;
      font-size: 14px;
    }
    .ing-name { color: var(--text-mid); line-height: 1.4; font-size: 15px; }

    /* INSTRUCTIONS */
    .step-list { list-style: none; }
    .step-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .step-num {
      background: var(--bg);
      color: var(--accent);
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1.5px solid var(--border);
    }
    .step-text { font-size: 15px; line-height: 1.7; color: var(--text-mid); }

    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    /* RATING FILTER BAR */
    .rating-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 10px; overflow-x: auto; position: sticky; top: 49px; z-index: 49; }
    .rating-bar-label { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; flex-shrink: 0; }
    .rfilter-btn { display: flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-mid); white-space: nowrap; transition: all 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
    .rfilter-btn.active-e { background: #FFF8E7; border-color: #F5A623; color: #B8810A; }
    .rfilter-btn.active-k { background: #F5EEF8; border-color: #9B59B6; color: #7D3C98; }
    .rfilter-btn.active-a { background: var(--sage-light); border-color: var(--sage); color: var(--sage); }
    .rfilter-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    /* MINI STARS IN HEADER */
    .card-stars { display: flex; gap: 10px; margin-top: 6px; }
    .card-star-group { display: flex; align-items: center; gap: 2px; }
    .card-star-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); margin-right: 2px; }
    .mini-star { font-size: 10px; line-height: 1; color: var(--border); }
    .mini-star.e { color: #F5A623; }
    .mini-star.k { color: #9B59B6; }
    /* RATING IN CARD BODY */
    .rating-section { padding: 18px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .rating-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .rating-row:last-child { margin-bottom: 0; }
    .rater-name { font-size: 13px; font-weight: 700; min-width: 76px; }
    .rater-name.e { color: #B8810A; }
    .rater-name.k { color: #7D3C98; }
    .stars-input { display: flex; gap: 4px; }
    .star-btn { font-size: 26px; line-height: 1; background: none; border: none; cursor: pointer; padding: 2px; -webkit-tap-highlight-color: transparent; color: #E0E0DC; }
    .star-btn.e { color: #F5A623; }
    .star-btn.k { color: #9B59B6; }
    .rating-clear { font-size: 11px; color: var(--text-light); background: none; border: none; cursor: pointer; padding: 4px; text-decoration: underline; }
  </style>
</head>

      "En un tazón, combina la avena molida, la proteína en polvo, las almendras molidas y la sal.",
      "En otro recipiente, mezcla la mantequilla de frutos secos, la leche, la miel y la vainilla hasta obtener una mezcla suave.",
      "Vierte los ingredientes húmedos en los secos y mezcla hasta obtener una masa espesa y moldeable (similar a masa de galletas). Incorpora los chips de chocolate.",
      "Presiona la mezcla firmemente en el molde asegurándote de que quede pareja y compacta.",
      "Refrigera 1–2 horas hasta que esté firme.",
      "Derrite el chocolate con el aceite de coco (a baño María o en microondas en intervalos de 30 seg). Incorpora la mantequilla de frutos secos y mezcla.",
      "Vierte la cobertura de chocolate sobre las barras frías y regresa al refrigerador hasta que el chocolate endurezca (aprox. 30 min).",
      "Corta en 8 barras. Guarda en el refrigerador en un recipiente hermético por hasta 1 semana."
    ]
  }
];

// State
const multipliers = {};
let currentFilter = 'todas';

function initRecipes(data) {
  recipes = data;
  recipes.forEach(r => { if (!multipliers[r.id]) multipliers[r.id] = 1; });
}

// Fraction display
function fmtAmount(amount, mult) {
  if (amount === null) return '';
  const val = amount * mult;
  const fracs = [
    [1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],
    [1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']
  ];
  const int = Math.floor(val);
  const dec = val - int;
  let fStr = '';
  for (const [f, s] of fracs) {
    if (Math.abs(dec - f) < 0.025) { fStr = s; break; }
  }
  if (int === 0 && fStr) return fStr;
  if (fStr) return int + ' ' + fStr;
  if (Math.abs(val - Math.round(val)) < 0.025) return Math.round(val).toString();
  return val.toFixed(1);
}

function renderIngredients(recipe, mult) {
  return recipe.groups.map(g => {
    let html = '';
    if (g.name) html += `<div class="group-title">${g.name}</div>`;
    html += '<ul class="ing-list">';
    for (const ing of g.items) {
      const amt = fmtAmount(ing.a, mult);
      const unit = ing.u ? ' ' + ing.u : '';
      html += `<li class="ing-item">
        <span class="ing-amount">${amt}${unit}</span>
        <span class="ing-name">${ing.n}</span>
      </li>`;
    }
    html += '</ul>';
    return html;
  }).join('');
}

function servingsText(recipe, mult) {
  const n = recipe.servingsBase * mult;
  const num = Number.isInteger(n) ? n : (n % 1 === 0.5 ? n : n.toFixed(1));
  return `${num} ${recipe.servingsUnit}`;
}

function renderMiniStars(recipeId) {
  const r = ratings[recipeId] || {};
  let html = '';
  if (r.e) {
    html += `<span class="card-star-group"><span class="card-star-label">Yo</span>` +
      Array.from({length:5}, (_,i) => `<span class="mini-star${i<r.e?' e':''}">★</span>`).join('') + `</span>`;
  }
  if (r.k) {
    html += `<span class="card-star-group"><span class="card-star-label">Edmundo</span>` +
      Array.from({length:5}, (_,i) => `<span class="mini-star${i<r.k?' k':''}">★</span>`).join('') + `</span>`;
  }
  return html;
}

function renderRatingInputs(recipeId) {
  const r = ratings[recipeId] || {};
  const row = (person, label, cls) => {
    const stars = Array.from({length:5}, (_,i) =>
      `<button class="star-btn${r[person]>=i+1?' '+cls:''}" onclick="saveRating(${recipeId},'${person}',${i+1})">★</button>`
    ).join('');
    const clear = r[person] ? `<button class="rating-clear" onclick="clearRating(${recipeId},'${person}')">limpiar</button>` : '';
    return `<div class="rating-row"><span class="rating-label">${label}</span><div class="stars-input">${stars}</div>${clear}</div>`;
  };
  return row('e','Karla','e') + row('k','Edmundo','k');
}

function saveRating(recipeId, person, value) {
  if (!ratings[recipeId]) ratings[recipeId] = {};
  ratings[recipeId][person] = (ratings[recipeId][person] === value) ? undefined : value;
  if (!ratings[recipeId][person]) delete ratings[recipeId][person];
  if (!Object.keys(ratings[recipeId]).length) delete ratings[recipeId];
  localStorage.setItem('recetario-ratings', JSON.stringify(ratings));
  const ratingEl = document.getElementById(`ratings-${recipeId}`);
  if (ratingEl) ratingEl.innerHTML = renderRatingInputs(recipeId);
  const starsEl = document.getElementById(`stars-${recipeId}`);
  if (starsEl) { starsEl.innerHTML = renderMiniStars(recipeId); starsEl.style.display = starsEl.innerHTML ? '' : 'none'; }
}

function clearRating(recipeId, person) {
  if (ratings[recipeId]) { delete ratings[recipeId][person]; if (!Object.keys(ratings[recipeId]).length) delete ratings[recipeId]; }
  localStorage.setItem('recetario-ratings', JSON.stringify(ratings));
  const ratingEl = document.getElementById(`ratings-${recipeId}`);
  if (ratingEl) ratingEl.innerHTML = renderRatingInputs(recipeId);
  const starsEl = document.getElementById(`stars-${recipeId}`);
  if (starsEl) { starsEl.innerHTML = renderMiniStars(recipeId); starsEl.style.display = starsEl.innerHTML ? '' : 'none'; }
}

function filterByRating(type) {
  ratingFilter = type;
  document.querySelectorAll('.rfilter-btn').forEach(b => b.classList.remove('active-e','active-k','active-a'));
  const map = { all:'active-a', e5:'active-e', k5:'active-k', rated:'active-a' };
  document.getElementById('rfilter-'+type).classList.add(map[type]);
  render();
}

function render() {
  let filtered = currentFilter === 'todas'
    ? recipes
    : recipes.filter(r => r.category === currentFilter);

  if (ratingFilter === 'e5') filtered = filtered.filter(r => (ratings[r.id]||{}).e >= 5);
  else if (ratingFilter === 'k5') filtered = filtered.filter(r => (ratings[r.id]||{}).k >= 5);
  else if (ratingFilter === 'rated') filtered = filtered.filter(r => ratings[r.id] && ((ratings[r.id].e||0)+(ratings[r.id].k||0)>0));

  document.getElementById('grid').innerHTML = filtered.map(r => {
    const mult = multipliers[r.id];
    const catClass = r.category === 'fuerte' ? 'badge-fuerte' : 'badge-snack';
    const catLabel = r.category === 'fuerte' ? 'Plato Fuerte' : 'Postre & Snack';
    const iconClass = r.category === 'fuerte' ? 'card-icon sage' : 'card-icon';
    const miniStars = renderMiniStars(r.id);
    return `
    <div class="card" id="card-${r.id}">
      <div class="card-header" onclick="toggle(${r.id})">
        <div class="${iconClass}">${ICONS[r.icon]}</div>
        <div class="card-info">
          <div class="card-name">${r.name}</div>
          <div class="card-meta">
            <span class="meta">${ICONS.clock} ${r.time}</span>
            <span class="meta">${ICONS.users} ${r.servingsBase} ${r.servingsUnit}</span>
          </div>
          <span class="badge ${catClass}">${catLabel}</span>
          <div class="card-stars" id="stars-${r.id}" style="${miniStars?'':'display:none'}">${miniStars}</div>
        </div>
        <div class="chevron" id="chev-${r.id}">${ICONS.chevron}</div>
      </div>
      <div class="card-body" id="body-${r.id}">
        <div class="multiplier">
          <div class="mult-left">
            <div class="mult-title">${ICONS.sliders} Cantidades</div>
            <div class="mult-servings" id="srv-${r.id}">${servingsText(r, mult)}</div>
          </div>
          <div class="mult-btns">
            <button class="mult-btn ${mult===0.5?'active':''}" onclick="setMult(${r.id},0.5,event)">½×</button>
            <button class="mult-btn ${mult===1?'active':''}" onclick="setMult(${r.id},1,event)">1×</button>
            <button class="mult-btn ${mult===2?'active':''}" onclick="setMult(${r.id},2,event)">2×</button>
          </div>
        </div>
        <div class="section-title">${ICONS.list} Ingredientes</div>
        <div id="ings-${r.id}">${renderIngredients(r, mult)}</div>
        <div class="divider"></div>
        <div class="section-title">${ICONS.steps} Preparación</div>
        <ol class="step-list">
          ${r.steps.map((s,i) => `
            <li class="step-item">
              <div class="step-num">${i+1}</div>
              <div class="step-text">${s}</div>
            </li>`).join('')}
        </ol>
        <div class="divider"></div>
        <div class="rating-section">
          <div class="section-title">⭐ Calificación</div>
          <div id="ratings-${r.id}">${renderRatingInputs(r.id)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  document.getElementById(`body-${id}`).classList.toggle('open');
  document.getElementById(`chev-${id}`).classList.toggle('open');
}

function setMult(id, mult, e) {
  e.stopPropagation();
  multipliers[id] = mult;
  const recipe = recipes.find(r => r.id === id);
  document.getElementById(`ings-${id}`).innerHTML = renderIngredients(recipe, mult);
  document.getElementById(`srv-${id}`).textContent = `→ ${servingsText(recipe, mult)}`;
  document.querySelectorAll(`#card-${id} .mult-btn`).forEach(btn => {
    const v = btn.textContent === '½×' ? 0.5 : btn.textContent === '1×' ? 1 : 2;
    btn.classList.toggle('active', v === mult);
  });
}

function filter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['todas','fuerte','snack'][i] === cat);
  });
  render();
}

// ── Inicialización: intenta cargar recipes.json, fallback a datos embebidos ──
(async function init() {
  try {
    const res = await fetch('recipes.json');
    if (!res.ok) throw new Error('no json');
    const data = await res.json();
    initRecipes(data);
  } catch {
    initRecipes(EMBEDDED);
  }
  render();
})();
</script>
</body>
</html>
